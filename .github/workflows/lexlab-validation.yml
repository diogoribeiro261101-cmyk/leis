name: LexLab validation
on:
  push:
    paths:
      - 'web/lexlab/**'
      - '.github/workflows/lexlab-validation.yml'
  pull_request:
    paths:
      - 'web/lexlab/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/lexlab/tests/*.test.cjs
